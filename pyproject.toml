[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplearning-examples"
version = "0.1.0"
description = "Deep-learning examples for biological time-course classification, detection, and generative AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aeon>=1.3,<1.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
tuning = [
    "optuna>=4.0",
]
experiment = [
    "captum>=0.8",
    "mlflow>=3.0",
    "optuna>=4.0",
]
all = [
    "captum>=0.8",
    "mlflow>=3.0",
    "torch>=2.0",
    "optuna>=4.0",
]

[tool.setuptools]
packages = [
    "deeplearning_examples",
    "pytorch_cdgan",
    "burst_detection",
    "pytorch_timecourse_classification",
    "pytorch_timecourse_classification.models",
]

[tool.setuptools.package-dir]
deeplearning_examples = "src/deeplearning_examples"
pytorch_cdgan = "projects/timecourse-generation/src/pytorch_cdgan"
burst_detection = "projects/burst_detection/src/burst_detection"
pytorch_timecourse_classification = "projects/timecourse_classification/src/pytorch_timecourse_classification"
"pytorch_timecourse_classification.models" = "projects/timecourse_classification/src/pytorch_timecourse_classification/models"
